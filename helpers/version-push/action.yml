name: 'Muthur Command Helper: version-push'
description: 'Bump a version field in the Muthur Command OS version JSON repo and push (see P0 version contract)'
inputs:
  version-repository:
    required: false
    default: 'https://github.com/muthur-command/version.git'
    description: 'Git clone URL for the version JSON repository'
  key:
    required: true
    default: ''
    description: 'JSON key path to set, e.g. supervisor, muthurcommand.default, mcos, or mcos[] for all entries under mcos'
  key-description:
    required: false
    description: "Human Friendly description of key which is beeing changed for git commit message."
  version:
    required: true
    default: ''
  channel:
    default: 'dev'
  exclude-list:
    required: false
    default: '[]'
    description: "Exclude specific keys from being updated. Provide a JSON array of keys to exclude."
runs:
  using: "composite"
  steps: 
    - shell: bash
      id: validate-input
      env:
        INPUTS_KEY: ${{ inputs.key }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_KEY_DESCRIPTION: ${{ inputs.key-description }}
      run: |
        if [[ -z "$INPUTS_KEY" ]];then
          echo "::error::Missing required key 'key' input!"
          exit 1
        elif [[ -z "$INPUTS_VERSION" ]];then
          echo "::error::Missing required key 'version' input!"
          exit 1
        fi
        if [[ -z "$INPUTS_KEY_DESCRIPTION" ]];then
          echo "key-description=$INPUTS_KEY" >> "$GITHUB_OUTPUT"
        else
          echo "key-description=$INPUTS_KEY_DESCRIPTION" >> "$GITHUB_OUTPUT"
        fi

    - shell: bash
      env:
        VERSION_REPO: ${{ inputs.version-repository }}
      run: git clone --depth 1 "$VERSION_REPO" /tmp/version

    - shell: bash
      env:
        INPUTS_KEY: ${{ inputs.key }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_CHANNEL: ${{ inputs.channel }}
        INPUTS_EXCLUDE_LIST: ${{ inputs['exclude-list'] }}
      run: |
        temp=$(mktemp)
        CHANNEL="${INPUTS_CHANNEL:-dev}"
        json="/tmp/version/${CHANNEL}.json"
        if [[ ! -f "$json" ]]; then
          echo "::error::Version repo channel file missing: ${json} (channel was empty or invalid; default is dev)"
          ls -la /tmp/version || true
          exit 1
        fi
        # Check if exclude list is not empty
        if [[ "$INPUTS_EXCLUDE_LIST" != "[]" ]]; then
          # Strip the [] suffix from INPUTS_KEY
          CLEAN_KEY="${INPUTS_KEY%\[\]}"

          jq --arg key "$CLEAN_KEY" \
            --arg version "$INPUTS_VERSION" \
            --argjson exclude "$INPUTS_EXCLUDE_LIST" '
            .[$key] |= with_entries(
              if (.key | IN($exclude[])) then
                .
              else
                .value = $version
              end
            )
          ' "$json" > "${temp}"
        else
          jq ".$INPUTS_KEY |= \"$INPUTS_VERSION\"" "$json" > "${temp}"
        fi
        mv "${temp}" "$json"

    - shell: bash
      env:
        INPUTS_VERSION: ${{ inputs.version }}
      run: |
        cd /tmp/version
        git commit -am "Bump ${{ steps.validate-input.outputs.key-description }} to $INPUTS_VERSION"
        git push

    - shell: bash
      run: rm -rf /tmp/version